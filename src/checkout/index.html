<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>
  <meta name="description"
    content="Complete your SleepOutside order — enter your shipping and payment details to place your order." />

  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/checkout.js" type="module"></script>
</head>

<body>
  <header id="main-header" class="divider"></header>

  <main class="divider">
    <section class="products checkout-section">
      <h2>Review &amp; Place your Order</h2>

      <div class="checkout-wrapper">
        <!-- Order Summary -->
        <div class="order-summary">
          <h3>Order Summary</h3>
          <dl class="order-summary__list">
            <dt>Subtotal</dt>
            <dd id="subtotal">$0.00</dd>
            <dt>Shipping</dt>
            <dd id="shipping">$0.00</dd>
            <dt>Tax</dt>
            <dd id="tax">$0.00</dd>
            <dt class="order-summary__total-label">Order Total</dt>
            <dd class="order-summary__total-value" id="order-total">$0.00</dd>
          </dl>
        </div>

        <!-- Checkout Form -->
        <form id="checkout-form" class="checkout-form">
          <fieldset class="checkout-form__fieldset">
            <legend>Shipping Information</legend>

            <div class="form-group">
              <label for="fname">First Name</label>
              <input type="text" id="fname" name="fname" required autocomplete="given-name" />
            </div>

            <div class="form-group">
              <label for="lname">Last Name</label>
              <input type="text" id="lname" name="lname" required autocomplete="family-name" />
            </div>

            <div class="form-group">
              <label for="street">Street Address</label>
              <input type="text" id="street" name="street" required autocomplete="street-address" />
            </div>

            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" name="city" required autocomplete="address-level2" />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="state">State</label>
                <input type="text" id="state" name="state" required autocomplete="address-level1" />
              </div>

              <div class="form-group">
                <label for="zip">Zip Code</label>
                <input type="text" id="zip" name="zip" required inputmode="numeric" pattern="[0-9]{5}(-[0-9]{4})?"
                  autocomplete="postal-code" />
              </div>
            </div>
          </fieldset>

          <fieldset class="checkout-form__fieldset">
            <legend>Payment Information</legend>

            <div class="form-group">
              <label for="cardNumber">Credit Card Number</label>
              <input type="text" id="cardNumber" name="cardNumber" required inputmode="numeric"
                autocomplete="cc-number" />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="expiration">Expiration Date</label>
                <input type="text" id="expiration" name="expiration" required placeholder="MM/YY"
                  autocomplete="cc-exp" />
              </div>

              <div class="form-group">
                <label for="code">Security Code</label>
                <input type="text" id="code" name="code" required inputmode="numeric" autocomplete="cc-csc" />
              </div>
            </div>
          </fieldset>

          <button type="submit" id="checkout-submit" class="checkout-submit">
            Place Order
          </button>
        </form>
      </div>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
